<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dashboard · ScholarDesk</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body data-page="dashboard">
  <div id="app"></div>

  <!-- app.js inserts this dashboard card after the live database statistics load. -->
  <template id="voice-assistant-template">
    <section class="panel voice-assistant-card" id="voice-assistant" aria-labelledby="voice-assistant-title">
      <div class="voice-card-head">
        <div>
          <div class="voice-eyebrow">SCHOLARDESK VOICE</div>
          <h2 id="voice-assistant-title">Voice Assistant</h2>
          <p>Ask about dashboard totals or find a student by name, roll number or email.</p>
        </div>
        <div class="voice-state"><span class="voice-status-dot"></span><span id="voice-status">Ready</span></div>
      </div>
      <div class="voice-card-controls">
        <form id="voice-search-form" class="voice-search-form">
          <label class="visually-hidden" for="voice-query">Search students or ask about dashboard statistics</label>
          <input id="voice-query" type="search" maxlength="100" placeholder="Try “How many students?” or “Find Ananya Rao”">
          <button class="btn btn-primary" type="submit">Search <span>→</span></button>
        </form>
        <div class="voice-buttons">
          <button id="voice-listen" class="btn btn-primary voice-mic-button" type="button"><span class="mic-symbol" aria-hidden="true">🎙</span> Start Listening</button>
          <button id="voice-stop-speaking" class="btn btn-light voice-control-button" type="button">Stop Speaking</button>
          <button id="voice-toggle" class="btn btn-outline-primary voice-control-button" type="button" aria-pressed="true">Voice ON</button>
          <button id="voice-speaker" class="voice-speaker-button" type="button" aria-label="Read the last response aloud" title="Read the last response aloud">🔊</button>
        </div>
      </div>
      <div id="voice-response" class="voice-response" role="status" aria-live="polite">
        <span class="voice-response-mark">✦</span>
        <span>Try asking for the dashboard summary or search for a student.</span>
      </div>
    </section>
  </template>

  <script src="/js/app.js"></script>
  <script src="/js/voice-assistant.js"></script>
</body>
</html>
